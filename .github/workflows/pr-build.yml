name: Vérifier une proposition

# Construit le code exact d'une proposition de changement (branche ou fork),
# sans jamais lui donner de jeton d'écriture. C'est la seule étape qui
# exécute du code venu de l'extérieur (Krystine ou toute autre personne).
# Si ça construit, pr-automerge.yml prend le relais avec un jeton d'écriture,
# sans jamais exécuter le code lui-même.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Site
        run: |
          npm ci
          npm run build

      - name: Fonctions (typage seulement)
        run: |
          cd functions
          npm ci
          npx tsc --noEmit

      # Le job de fusion (pr-automerge.yml) tourne dans un déclencheur
      # workflow_run pour avoir un jeton d'écriture, mais ce déclencheur ne
      # sait pas retrouver le numéro d'une PR venue d'un fork (l'API commit→PR
      # ne cherche que dans CE dépôt). On le lui passe par artefact.
      - name: Déposer le numéro de la PR (pour le job de fusion)
        if: always()
        run: echo "${{ github.event.pull_request.number }}" > pr_number.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr_number
          path: pr_number.txt
          retention-days: 1
