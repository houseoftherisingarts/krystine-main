    <!-- Tailwind CDN for utility classes used by Inspirata styles.
         Origine palette: copper / sauge / brun / prune / bleu-mineral /
         beige / ivoire / gris-pierre. Legacy tokens (royal, gold, surface,
         white) are remapped to Origine so existing utility classes shift
         without rewriting markup. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              // Remap global vers L'Œuvre — restyle toutes les pages d'un coup.
              copper:      '#bb9a5e',  // ex-#B8532F → brass (fill/decor); accent TEXTE = brassInk
              copperDeep:  '#a3823f',
              sauge:       '#665746',  // sauge neutralisé en ink-soft (pas de vert dans L'Œuvre, sauf forest)
              brun:        '#5a4a37',
              brunFonce:   '#2a2015',  // espresso-soft
              prune:       '#3a2b22',
              bleuMineral: '#2a2015',
              beige:       '#ede5d7',  // cream-3
              ivoire:      '#f6f3ee',  // cream
              grisPierre:  '#8c8268',
              royal:   '#2a2015',
              gold:    '#bb9a5e',  // brass
              surface: '#f6f3ee',  // cream
              white:   '#f6f3ee',  // (ex-ivoire warm) → cream
              // L'Œuvre — tokens nommés (réf 30_library/loeuvre-design-system).
              brass:        '#bb9a5e',  // accent unique (décor/fond/bouton)
              brassDeep:    '#a3823f',
              brassBright:  '#dcb874',  // hover / surbrillance
              brassInk:     '#7d6330',  // accent EN TEXTE sur crème (AA 5.13:1)
              espresso:     '#1d1604',
              espressoDeep: '#16100a',
              espressoSoft: '#2a2015',
              cream:        '#f6f3ee',
              cream2:       '#f1ebe0',
              cream3:       '#ede5d7',
              card:         '#faf7f0',
              ink:          '#3a3126',
              inkSoft:      '#665746',
              ochre:        '#c79a52',
              terracotta:   '#b06a3f',
              ctext:        '#f4ece0',  // texte sur sombre
              ctextSoft:    '#cdbfa9',
              // Accent botanique (Origine) — vert forêt secondaire
              forest:       '#4a5d52',
              forestDeep:   '#3a4d42',
              forestSoft:   '#6f8478',
              // Fond sombre du Foyer : encre de forêt, jamais le brun (24 août 2026)
              encre:        '#0f1613',
              encreSoft:    '#1a2420',
            },
            fontFamily: {
              serif: ['"Cormorant Garamond"', 'serif'],
              sans: ['"Inter"', 'sans-serif'],
            },
            borderRadius: {
              brand: '30px',
            },
            boxShadow: {
              glow:  '0 0 30px rgba(184,83,47,0.18)',
              depth: '0 8px 24px rgba(107,74,47,0.08)',
            },
          }
        }
      }
    </script>

    <style>
      /* no-italic-rule: règle dure d'Alex, jamais d'italique. L'accent passe par la couleur et le poids. */
      em, i, .italic, [class*="italic"] { font-style: normal !important; }
      /* touch-target-rule: on touch screens, plain text links and buttons get a 44px hit area without moving a pixel. */
      @media (pointer: coarse) {
        a:not(:has(*)), button:not(:has(*)) { position: relative; }
        a:not(:has(*))::before, button:not(:has(*))::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 44px; transform: translateY(-50%); }
      }
      /* ──────────────────────────────────────────────────────────────
         Origine — signature visuelle
         Éditoriale · organique · ancrée · haut de gamme · silencieuse
         ────────────────────────────────────────────────────────────── */
      :root {
        --color-copper:       #bb9a5e;
        --color-copper-deep:  #a3823f;
        --color-sauge:        #665746;
        --color-brun:         #5a4a37;
        --color-brun-fonce:   #2a2015;
        --color-prune:        #3a2b22;
        --color-bleu-mineral: #2a2015;
        --color-beige:        #ede5d7;
        --color-ivoire:       #f6f3ee;
        --color-gris-pierre:  #8c8268;
        --shadow-origine:     0 8px 24px rgba(107, 74, 47, 0.08);
        --shadow-origine-lg:  0 16px 36px rgba(107, 74, 47, 0.10);
      }

      html { scroll-behavior: smooth; }
      /* Prevent any off-screen animation (parallax sprigs, letter reveal,
         founder wash sweep) from showing a horizontal scrollbar. */
      /* clip (pas hidden) : même coupe visuelle, mais ne crée pas de
         conteneur de défilement, donc position:sticky reste fonctionnel
         (le hidden cassait la section pinnée du Foyer). */
      html, body { overflow-x: clip; }
      /* Discreet scrollbar — sauge at low opacity so it disappears into
         the parchment palette instead of shouting copper. */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: rgba(122, 128, 102, 0.35);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover { background: rgba(122, 128, 102, 0.55); }
      /* Firefox */
      html { scrollbar-width: thin; scrollbar-color: rgba(122, 128, 102, 0.35) transparent; }
      body { font-family: 'Inter', sans-serif; }

      /* Base L'Œuvre — espresso uni comme couche la plus reculée pour
         TOUTES les pages de la refonte. Plus de photo parchemin globale :
         elle appartenait à l'ancien design ivoire, se chargeait sur chaque
         page (image inutile) et flashait derrière les pages pendant les
         transitions. Chaque page peint son propre fond par-dessus. */
      /* Fond global = crème V2 : le site est majoritairement magazine crème,
         un fond sombre flashait du brun entre les pages et à l'overscroll.
         Les pages sombres (admin, TV) peignent leur propre fond par-dessus. */
      body {
        background-color: #f4efe6;
        color: #1c1712;
      }

      .origine-card {
        background: var(--color-ivoire);
        border: 1px solid rgba(184, 83, 47, 0.16);
        border-radius: 20px;
        box-shadow: var(--shadow-origine);
      }
      /* Low-contrast filter removed at request — pictures now render at
         their native saturation/contrast. Keep the class hook so the
         JSX consumers don't need to be touched, but it's a no-op now. */
      .origine-image-soft { filter: none; }
      .origine-image-wash::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(232, 208, 190, 0.15);
        pointer-events: none;
      }
      .origine-btn {
        background: var(--color-sauge);
        color: var(--color-ivoire);
        border: 1px solid rgba(184, 83, 47, 0.5);
        transition: filter 0.3s ease;
      }
      .origine-btn:hover { filter: brightness(1.05); }
      .origine-btn--brun { background: var(--color-brun); }
      .origine-picto {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2.75rem;
        height: 2.75rem;
        border-radius: 9999px;
        background: var(--color-ivoire);
        color: var(--color-brun);
        border: 1px solid rgba(184, 83, 47, 0.3);
        font-size: 1.05rem;
      }
      .origine-picto i, .origine-picto svg { stroke-width: 2; color: var(--color-brun); }
      .origine-rule {
        height: 1px;
        background: linear-gradient(to right, transparent, rgba(184,83,47,0.4), transparent);
      }

      .glass-depth {
        background: rgba(244, 231, 221, 0.75);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(184, 83, 47, 0.18);
      }
      .dark .glass-depth {
        background: rgba(46, 30, 20, 0.7);
        border: 1px solid rgba(232, 208, 190, 0.08);
      }
      .glass-depth-dark {
        background: rgba(46, 30, 20, 0.6);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(232, 208, 190, 0.08);
      }
      .iridescent-glow { box-shadow: 0 0 30px rgba(184,83,47,0.12); }
      .text-shadow { text-shadow: 0 2px 20px rgba(58, 37, 30, 0.35); }
      .text-shadow-sm { text-shadow: 0 1px 8px rgba(58, 37, 30, 0.18); }
      .rounded-brand { border-radius: 30px; }
      .shadow-glow { box-shadow: 0 0 30px rgba(184,83,47,0.18); }
      .shadow-depth { box-shadow: var(--shadow-origine); }
      .transform-style-3d { transform-style: preserve-3d; }
      .perspective-1000 { perspective: 1000px; }
      .animate-pulse-slow { animation: pulse 4s ease-in-out infinite; }

      /* Hero title gold-foil shimmer — a slow sweep across a gradient
         that's masked to the text (bg-clip: text), so KRYSTINE ST-LAURENT
         feels stamped in warm metal instead of printed flat. */
      @keyframes krystine-shimmer {
        0%   { background-position: 0% 50%; }
        100% { background-position: 200% 50%; }
      }
      .krystine-shimmer-text {
        background-image: linear-gradient(
          110deg,
          #3A251E 0%, #3A251E 30%,
          #B8532F 44%, #E8CFA0 50%, #B8532F 56%,
          #3A251E 70%, #3A251E 100%
        );
        background-size: 250% 100%;
        background-position: 0% 50%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: krystine-shimmer 9s ease-in-out infinite;
        filter: drop-shadow(0 1px 18px rgba(184, 83, 47, 0.22));
      }
      .dark .krystine-shimmer-text {
        background-image: linear-gradient(
          110deg,
          #F4E7DD 0%, #F4E7DD 30%,
          #FFE5B8 46%, #FFF6DB 50%, #FFE5B8 54%,
          #F4E7DD 70%, #F4E7DD 100%
        );
      }
      @media (prefers-reduced-motion: reduce) {
        .krystine-shimmer-text { animation: none; background-position: 50% 50%; }
      }

      /* ──────────────────────────────────────────────────────────────
         Brand minimum readable text — 12 px floor across the entire
         site, mobile and desktop. Any Tailwind arbitrary text size
         below 12 px is bumped up so we catch every spot in one place
         without sweeping the codebase. <i> tags (Font-Awesome glyph
         icons) are intentionally NOT excluded — bumping a 9 px
         chevron to 12 px keeps the icon-with-text rhythm consistent
         at the new floor.
         ────────────────────────────────────────────────────────────── */
      .text-\[6px\],
      .text-\[7px\],
      .text-\[8px\],
      .text-\[9px\],
      .text-\[10px\],
      .text-\[11px\] {
        font-size: 12px !important;
      }
    </style>
  </head>

    <div id="root"></div>

  </body>
